name: Build standalone images

on:
  workflow_dispatch:
    inputs:
      rocksdb_repo:
        description: Official NebulaGraph repository (owner/name)
        required: false
        default: vesoft-inc/nebula
      rocksdb_ref:
        description: Official NebulaGraph ref
        required: false
        default: master
      topling_repo:
        description: Topling NebulaGraph repository (owner/name)
        required: false
        default: topling/nebula
      topling_ref:
        description: Topling NebulaGraph ref
        required: false
        default: toplingdb-bench
      toplingdb_repo:
        description: ToplingDB repository (owner/name)
        required: false
        default: topling/toplingdb
      toplingdb_ref:
        description: ToplingDB ref
        required: false
        default: memtable_as_log_index
      update_latest:
        description: Also tag and push :latest
        type: boolean
        required: false
        default: true
      build_rocksdb:
        description: Build rocksdb image
        type: boolean
        required: false
        default: true
      build_topling:
        description: Build topling image
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-standalone-images-${{ github.ref }}
  cancel-in-progress: false

env:
  BENCH_ROOT: ${{ github.workspace }}
  GHCR_OWNER: ${{ github.repository_owner }}
  CXXFLAGS: -Wno-interference-size

jobs:
  build-rocksdb:
    name: build-rocksdb
    if: ${{ inputs.build_rocksdb }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CCACHE_DIR: /tmp/ccache/nebula-standalone-rocksdb
    steps:
      - name: Checkout nebula-bench
        uses: actions/checkout@v5

      - name: Checkout official NebulaGraph
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.rocksdb_repo }}
          ref: ${{ inputs.rocksdb_ref }}
          path: deps/nebulagraph

      - name: Install Nebula build toolchain (host compile)
        run: bash scripts/ci/install-nebula-build-deps.sh

      - name: Cache ccache (rocksdb)
        uses: actions/cache@v5
        with:
          path: /tmp/ccache/nebula-standalone-rocksdb
          key: ${{ runner.os }}-ccache-rocksdb-${{ hashFiles('deps/nebulagraph/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-rocksdb-

      - name: Cache nebula third-party
        uses: actions/cache@v5
        with:
          path: deps/nebulagraph/build/third-party/install
          key: ${{ runner.os }}-nebula-tp-rocksdb-${{ hashFiles('deps/nebulagraph/third-party/install-third-party.sh') }}
          restore-keys: |
            ${{ runner.os }}-nebula-tp-rocksdb-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile on runner, docker package and push rocksdb image
        env:
          NEBULA_ROCKSDB_ROOT: ${{ github.workspace }}/deps/nebulagraph
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          EXTRA=(--push)
          if [[ "${{ inputs.update_latest }}" == "true" ]]; then
            EXTRA+=(--latest)
          fi
          bash scripts/ci/build-and-push-image.sh rocksdb "${EXTRA[@]}"
          SHA_TAG="$(git -C deps/nebulagraph rev-parse --short HEAD)"
          IMAGE="ghcr.io/${GHCR_OWNER}/nebula-standalone-rocksdb:${SHA_TAG}"
          docker rmi -f "${IMAGE}" 2>/dev/null || true
          docker pull "${IMAGE}"
          if [[ "${{ inputs.update_latest }}" == "true" ]]; then
            LATEST="ghcr.io/${GHCR_OWNER}/nebula-standalone-rocksdb:latest"
            docker rmi -f "${LATEST}" 2>/dev/null || true
            docker pull "${LATEST}"
          fi
          docker images | head -20

  build-topling:
    name: build-topling
    if: ${{ inputs.build_topling }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CCACHE_DIR: /tmp/ccache/nebula-standalone-topling
    steps:
      - name: Checkout nebula-bench
        uses: actions/checkout@v5

      - name: Checkout topling/nebula
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.topling_repo }}
          ref: ${{ inputs.topling_ref }}
          path: deps/nebulagraph-toplingdb

      - name: Checkout topling/toplingdb
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.toplingdb_repo }}
          ref: ${{ inputs.toplingdb_ref }}
          path: deps/toplingdb

      - name: Install Nebula build toolchain (host compile)
        run: bash scripts/ci/install-nebula-build-deps.sh

      - name: Cache ccache (topling)
        uses: actions/cache@v5
        with:
          path: /tmp/ccache/nebula-standalone-topling
          key: ${{ runner.os }}-ccache-topling-${{ hashFiles('deps/nebulagraph-toplingdb/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-topling-

      - name: Cache nebula third-party (topling)
        uses: actions/cache@v5
        with:
          path: deps/nebulagraph-toplingdb/build/third-party/install
          key: ${{ runner.os }}-nebula-tp-topling-${{ hashFiles('deps/nebulagraph-toplingdb/third-party/install-third-party.sh') }}
          restore-keys: |
            ${{ runner.os }}-nebula-tp-topling-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile on runner, docker package and push topling image
        env:
          NEBULA_TOPLING_ROOT: ${{ github.workspace }}/deps/nebulagraph-toplingdb
          TOPLINGDB_ROOT: ${{ github.workspace }}/deps/toplingdb
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          EXTRA=(--push)
          if [[ "${{ inputs.update_latest }}" == "true" ]]; then
            EXTRA+=(--latest)
          fi
          bash scripts/ci/build-and-push-image.sh topling "${EXTRA[@]}"
          SHA_TAG="$(git -C deps/nebulagraph-toplingdb rev-parse --short HEAD)"
          IMAGE="ghcr.io/${GHCR_OWNER}/nebula-standalone-topling:${SHA_TAG}"
          docker rmi -f "${IMAGE}" 2>/dev/null || true
          docker pull "${IMAGE}"
          if [[ "${{ inputs.update_latest }}" == "true" ]]; then
            LATEST="ghcr.io/${GHCR_OWNER}/nebula-standalone-topling:latest"
            docker rmi -f "${LATEST}" 2>/dev/null || true
            docker pull "${LATEST}"
          fi
          docker images | head -20
