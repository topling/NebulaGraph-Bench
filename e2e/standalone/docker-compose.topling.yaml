services:
  nebula-standalone:
    image: ${TOPLING_IMAGE:-ghcr.io/topling/nebula-standalone-topling:latest}
    container_name: nebula-standalone-topling
    environment:
      TOPLING_MIGRATE_PROFILE: ${TOPLING_MIGRATE_PROFILE:-enterprise}
    ports:
      - "9669:9669"
      - "19669:19669"
    volumes:
      - topling-data:/usr/local/nebula/data
      - topling-logs:/usr/local/nebula/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9669'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: "no"

volumes:
  topling-data:
  topling-logs:
