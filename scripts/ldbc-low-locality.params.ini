# LDBC SNB datagen (hadoop v0.3.3) overrides: maximize key-space / edge anti-locality
# using only params.ini knobs (no datagen code changes).
#
# Defaults use DistanceKnowsGenerator (P ~ baseProbCorrelated^indexDistance) and
# blockSize=10000, which make friends and communities map onto nearby accountIds.
# These overrides switch to random knows within large blocks.

# Random configuration-model edges instead of distance-decay friendship.
ldbc.snb.datagen.generator.knowsGenerator:ldbc.snb.datagen.generator.generators.knowsgenerators.RandomKnowsGenerator

# Knows are generated per block; enlarge so RandomKnows spans (almost) the whole SF.
# Default 10000 keeps many geo/community-adjacent ID islands.
ldbc.snb.datagen.generator.blockSize:1000000

# Neutralize DistanceKnows knobs if any code path still reads them.
ldbc.snb.datagen.generator.baseProbCorrelated:0.0
ldbc.snb.datagen.generator.limitProCorrelated:1.0

# Do not reorder persons for serialization (default true); keeps output aligned with
# generation order and avoids an extra community-sorted CSV layout.
ldbc.snb.datagen.serializer.persons.sort:false
